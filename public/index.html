<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cardio Weekly">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Cardio Weekly</title>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <div class="logo">
          <img src="/icon.svg" alt="" width="36" height="36">
          <div>
            <h1>Cardio Weekly</h1>
            <p class="subtitle" id="period"></p>
          </div>
        </div>
        <div class="header-actions">
          <button class="header-btn" id="libraryBtn" aria-label="Saved articles">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="library-badge hidden" id="libraryBadge"></span>
          </button>
          <button class="header-btn refresh-btn" id="refreshBtn" aria-label="Refresh">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Saved screen (separate view) -->
    <div class="saved-screen" id="savedScreen">
      <header>
        <div class="header-inner">
          <button class="header-btn" id="savedBackBtn" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <div>
            <h1>Library</h1>
          </div>
          <span class="count" id="savedCount" style="margin-left:auto"></span>
        </div>
      </header>
      <div class="saved-screen-body">
        <div class="category-chips" id="categoryChips"></div>
        <div class="card-list" id="savedList"></div>
        <p class="empty-msg" id="savedEmpty" style="display:none">No saved articles yet. Bookmark articles from the feed.</p>
      </div>
    </div>

    <main>
      <section class="section">
        <h2 class="section-heading">
          <span class="section-icon research-icon"></span>
          Research Publications
          <span class="count" id="researchCount"></span>
        </h2>
        <div class="card-list" id="researchList"></div>
      </section>

      <section class="section">
        <h2 class="section-heading">
          <span class="section-icon news-icon"></span>
          Business &amp; Industry News
          <span class="count" id="newsCount"></span>
        </h2>
        <div class="card-list" id="newsList"></div>
      </section>
    </main>

    <!-- Category picker modal -->
    <div class="modal-overlay hidden" id="categoryModal">
      <div class="modal-sheet">
        <div class="modal-header">
          <span class="modal-title">Save to category</span>
          <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
        </div>
        <div class="modal-chips" id="modalChips"></div>
        <div class="modal-add-row">
          <input type="text" id="newCategoryInput" class="modal-input" placeholder="New category..." maxlength="30">
          <button class="modal-add-btn" id="addCategoryBtn">Add</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <div class="loading" id="loading">
      <div class="pulse-heart">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="#ff4d6a">
          <path d="M12 4.5C7 -0.5 0 3 0 9c0 5 12 13 12 13s12-8 12-13c0-6-7-9.5-12-4.5z"/>
        </svg>
      </div>
      <p>Loading digest...</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
