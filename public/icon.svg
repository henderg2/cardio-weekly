<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Rich deep gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <!-- Heart gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#ee2a56"/>
    </linearGradient>
    <!-- Pulse line gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <!-- Soft glow behind heart -->
    <radialGradient id="glow" cx="50%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#ff4d6a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle top-left highlight -->
    <radialGradient id="sheen" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle grid texture lines -->
  <line x1="0" y1="170" x2="512" y2="170" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="342" x2="512" y2="342" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="342" y1="0" x2="342" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Glow behind heart -->
  <circle cx="256" cy="235" r="180" fill="url(#glow)"/>

  <!-- Heart shape — anatomical-style, slightly tilted for dynamism -->
  <path d="M256 380
    C256 380 128 290 128 205
    C128 160 160 125 200 125
    C228 125 245 148 256 168
    C267 148 284 125 312 125
    C352 125 384 160 384 205
    C384 290 256 380 256 380Z"
    fill="url(#heartGrad)"/>

  <!-- Inner heart shadow for depth -->
  <path d="M256 380
    C256 380 128 290 128 205
    C128 160 160 125 200 125
    C228 125 245 148 256 168
    C267 148 284 125 312 125
    C352 125 384 160 384 205
    C384 290 256 380 256 380Z"
    fill="url(#sheen)"/>

  <!-- ECG pulse line — bold, crisp -->
  <polyline
    points="72,268 168,268 195,268 215,230 235,320 256,210 276,290 296,250 316,268 344,268 440,268"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Top-left sheen overlay -->
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
</svg>
